# =============================================================================
# AI Pulse — Update and Deploy
#
# Runs the ingestion pipeline, commits updated feed data, builds the Astro
# site, and deploys to GitHub Pages.
#
# Schedule: twice daily at 07:00 and 19:00 UTC.
# Manual trigger: workflow_dispatch.
#
# Required repository secrets:
#   GEMINI_API_KEY  — Google AI Studio API key for Gemini summarization.
#
# Required repository settings:
#   Settings → Pages → Source → GitHub Actions
# =============================================================================

name: Update and Deploy

on:
  push:
    branches:
      - main
  schedule:
    # 07:00 UTC and 19:00 UTC daily.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      skip_ingestion:
        description: "Skip the Python ingestion pipeline (build only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Prevent concurrent runs to avoid feed.json conflicts.
concurrency:
  group: deploy
  cancel-in-progress: false

# Permissions required for GitHub Pages deployment.
permissions:
  contents: write        # to commit updated feed.json
  pages: write           # to deploy to Pages
  id-token: write        # required by actions/deploy-pages

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Ingest — fetch RSS, summarize with Gemini, write feed.json
  # ---------------------------------------------------------------------------
  ingest:
    name: Ingest RSS feeds
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_ingestion != 'true' }}

    outputs:
      commit_sha: ${{ steps.commit_data.outputs.commit_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Use DATA_SYNC_TOKEN (personal access token with admin bypass) if configured, fallback to GITHUB_TOKEN.
          token: ${{ secrets.DATA_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pipeline/requirements.txt"

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install pytest

      - name: Run Python tests
        run: python -m pytest pipeline/tests/ -v --tb=short

      - name: Run ingestion pipeline
        env:
          # GEMINI_API_KEY must be set in repository secrets.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: override the model.
          # GEMINI_MODEL: gemini-3.8-flash
        run: python -m pipeline.run

      - name: Commit updated feed data
        id: commit_data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/feed.json src/data/benchmarks.json src/data/models.json src/data/model-updates.json
          # Only commit if the files changed.
          if git diff --staged --quiet; then
            echo "No changes to data files — nothing to commit."
          else
            git commit -m "chore: update feed, benchmark, model catalog, and model updates data [skip ci]"
            git push
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Build and Deploy — install Node deps, build Astro, deploy to Pages
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Run after ingestion (if it ran); or directly if ingestion was skipped.
    needs: [ingest]
    # If ingest was skipped, still run build.
    if: ${{ always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped') }}

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Pull the exact commit produced by ingest (or trigger ref if ingest skipped).
          ref: ${{ needs.ingest.outputs.commit_sha || github.ref }}
          fetch-depth: 1

      - name: Record build metadata
        run: |
          COMMIT_SHA="${{ needs.ingest.outputs.commit_sha || github.sha }}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "{\"commit_sha\": \"$COMMIT_SHA\", \"build_time\": \"$BUILD_TIME\"}" > src/data/build.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Astro type check
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
