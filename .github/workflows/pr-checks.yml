# =============================================================================
# AI Pulse — Pull Request Quality Checks (On-Demand)
#
# Lightweight validation gate for feature, bugfix, and hotfix branches.
#
# DESIGNED FOR ZERO AI CREDIT USAGE:
# - Does NOT run the ingestion pipeline.
# - Does NOT make any Gemini API calls.
# - Does NOT deploy to GitHub Pages.
# - Only validates TypeScript types, static build, and Python unit tests.
#
# EXECUTION CONTROLS:
# - Does NOT run on every commit pushed to a branch (saves GitHub Actions minutes).
# - Runs on demand when:
#     1. The PR is labeled with "run-checks".
#     2. Manually dispatched via GitHub Actions UI (workflow_dispatch).
# =============================================================================

name: PR Quality Checks

on:
  pull_request:
    types: [labeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Code & Test Validation (0 AI Credits)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'run-checks') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pipeline/requirements.txt"

      - name: Install Python test dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install pytest

      - name: Run Python unit tests (Mock Data Only)
        run: python -m pytest pipeline/tests/ -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Astro & TypeScript type check
        run: npm run check

      - name: Test Astro static production build
        run: npm run build
